<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>운영 에이전트 채팅 (Vue)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #1e1e2e; color: #e2e2f0;
    overflow: hidden;   /* #log만 스크롤되게, 바디 자체는 늘어나지 않게 고정 */
  }
  #app {
    flex: 1; min-height: 0;   /* Vue 마운트 루트가 header/#log/form을 감싸므로,
                                 body의 flex 흐름이 여기까지 이어지게 한다 */
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: #262638; border-bottom: 1px solid #3a3a52;
    font-weight: 600; font-size: 15px;
  }
  header span { color: #8b8bd8; font-weight: 400; font-size: 13px; margin-left: 8px; }
  #log {
    flex: 1; min-height: 0;   /* flex 자식 기본 최소높이(콘텐츠 크기)를 풀어줘야
                                 내용이 길어져도 바디가 안 늘어나고 여기서만 스크롤됨 */
    overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  #log::-webkit-scrollbar { width: 9px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: #3a3a52; border-radius: 6px; }
  #log::-webkit-scrollbar-thumb:hover { background: #4a4a68; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.5;
    font-size: 14px; white-space: pre-wrap;
  }
  .row.user .bubble { background: #5b5bd6; color: white; border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: #2e2e42; border-bottom-left-radius: 4px; }
  .row.error .bubble { background: #4a1f24; border: 1px solid #c24b55; color: #ffd7da; border-bottom-left-radius: 4px; }
  .row.error .err-id { display: block; margin-top: 4px; font-size: 11px; opacity: .7; }
  .steps {
    max-width: 70%; font-size: 12px; color: #9a9ac0; padding: 6px 14px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .steps .step::before { content: "⏳ "; }
  .steps .step.done::before { content: "✓ "; color: #7ee787; }
  .prompt-box {
    flex-shrink: 0;   /* #log가 스크롤 영역이 되면서(min-height:0) <details>가 flex
                         자식으로서 내용 없이 찌그러지는 걸 방지 */
    max-width: 70%; margin-top: -4px; background: #17171f; border: 1px solid #3a3a52;
    border-radius: 10px; font-size: 12px; overflow: hidden;
  }
  .prompt-box summary {
    cursor: pointer; padding: 7px 12px; color: #8b8bd8; user-select: none;
    list-style: none;
  }
  .prompt-box summary::-webkit-details-marker { display: none; }
  .prompt-box summary::before { content: "🔍 "; }
  .prompt-box[open] summary::before { content: "🔽 "; }
  .prompt-box pre {
    margin: 0; padding: 10px 12px; border-top: 1px solid #3a3a52;
    background: #11111a; color: #c3c3e0; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; max-height: 320px; overflow-y: auto;
  }
  form { display: flex; gap: 8px; padding: 14px 20px; background: #262638; border-top: 1px solid #3a3a52; }
  input {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid #3a3a52;
    background: #1e1e2e; color: #e2e2f0; font-size: 14px;
  }
  input:focus { outline: 1px solid #5b5bd6; }
  button {
    padding: 11px 20px; border-radius: 10px; border: none; background: #5b5bd6;
    color: white; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #3a3a52; cursor: default; }
  /* 개선 7 — 보조 LLM으로 대체된 단계 */
  .steps .step.warn::before { content: "⚡ "; }
  .steps .step.warn { color: #f2c46d; }
  /* 개선 8 — 조치 승인 카드 */
  .approval {
    flex-shrink: 0; max-width: 70%; background: #2a2433; border: 1px solid #b08bd8;
    border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.5;
  }
  .approval h4 { margin: 0 0 8px; font-size: 14px; color: #d8c2f2; }
  .approval .act { padding: 6px 0; border-top: 1px dashed #4a3f5c; }
  .approval .act:first-of-type { border-top: none; }
  .approval .act b { color: #fff; }
  .approval .act small { display: block; color: #a99abf; }
  .approval .controls { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .approval .controls input { flex: 1; min-width: 140px; padding: 7px 10px; font-size: 13px; }
  .approval .controls button { padding: 7px 14px; font-size: 13px; }
  .approval .controls button.reject { background: #4a3f5c; }
  .approval .note { margin-top: 8px; font-size: 12px; color: #a99abf; }
  .approval .result { margin-top: 10px; white-space: pre-wrap; color: #c9f2d0; }
  .approval .result.bad { color: #ffd7da; }
</style>
</head>
<body>
<div id="app">
  <header>운영 인시던트 대응 에이전트 <span>{{ backendLabel }}</span></header>
  <div id="log" ref="logEl">
    <template v-for="item in log" :key="item.id">
      <div v-if="item.kind === 'user'" class="row user">
        <div class="bubble">{{ item.text }}</div>
      </div>

      <div v-else-if="item.kind === 'steps'" class="steps">
        <div v-for="(step, i) in item.steps" :key="i" class="step" :class="{ warn: step.warn }">{{ step.text || step }}</div>
      </div>

      <div v-else-if="item.kind === 'approval'" class="approval">
        <h4>🛠 조치 승인 요청 — 승인해야만 실행됩니다</h4>
        <div v-for="(a, i) in item.actions" :key="i" class="act">
          <b>{{ a.system_name }}</b> · {{ a.label }}
          <small>현재 {{ a.before.status }} · CPU {{ a.before.cpu }}% · 메모리 {{ a.before.memory }}%
            <template v-if="a.before.alerts.length"> · {{ a.before.alerts.join(', ') }}</template>
            (근거 runbook: {{ a.incident_type }})</small>
        </div>
        <div v-if="item.status === 'pending' || item.status === 'sending'" class="controls">
          <input v-model="item.token" type="password" placeholder="관리자 토큰" autocomplete="off" />
          <button :disabled="item.status === 'sending' || !item.token" @click="decide(item, true)">승인·실행</button>
          <button class="reject" :disabled="item.status === 'sending' || !item.token" @click="decide(item, false)">거부</button>
        </div>
        <div v-if="item.error" class="result bad">⚠️ {{ item.error }}</div>
        <div v-if="item.report" class="result" :class="{ bad: item.status !== 'approved' }">{{ item.report }}</div>
        <div v-if="item.status === 'pending'" class="note">승인 권한은 관리자 토큰 보유자에게만 있습니다 · {{ Math.round(item.expires / 60) }}분이 지나면 만료되어 승인해도 실행되지 않습니다</div>
      </div>

      <div v-else-if="item.kind === 'agent'" class="row agent">
        <div class="bubble">{{ item.text }}</div>
      </div>
      <div v-else-if="item.kind === 'error'" class="row error">
        <div class="bubble">⚠️ {{ item.text }}<span v-if="item.errorId" class="err-id">문의 번호: {{ item.errorId }}</span></div>
      </div>

      <details v-else-if="item.kind === 'prompt'" class="prompt-box">
        <summary>LLM에 전달된 최종 프롬프트 보기</summary>
        <pre>{{ item.text }}</pre>
      </details>
    </template>
  </div>
  <form @submit.prevent="onSubmit">
    <input
      v-model="input"
      autocomplete="off"
      placeholder="예: auth-service 로그인 응답이 느려졌어요. 원인 확인해주세요"
    />
    <button type="submit" :disabled="sending">보내기</button>
  </form>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, reactive, nextTick } = Vue;

const MASK_LABELS = { API_KEY: 'API 키', JWT: '토큰', BEARER: '토큰', PASSWORD: '비밀번호',
  RRN: '주민번호', CARD: '카드번호', EMAIL: '이메일', PHONE: '전화번호', IP: 'IP 주소' };

const STEP_LABELS = {
  GuardrailApplied: e => e.input_masked?.length
      ? `🔒 민감정보 마스킹 후 전달 (${[...new Set(e.input_masked.map(t => MASK_LABELS[t] || t))].join(', ')})`
      : null,
  PlanCreated: e => `계획 수립: 할 일 ${e.task_count}가지${e.targets?.length ? ` (시스템: ${e.targets.join(', ')})` : ''}`,
  GateApplied: e => e.removed_analysis_tasks ? `불필요한 작업 ${e.removed_analysis_tasks}건 제거` : null,
  TaskCompleted: e => (e.source === 'monitoring'
      ? `모니터링 지표 확인 (시스템: ${e.target})`
      : `대응 매뉴얼(runbook) 조회 (장애유형: ${e.target})`) + (e.retries ? ' (재시도 성공)' : ''),
  ReplanCheck: e => e.is_sufficient ? null
      : `정보 부족 → 장애유형 "${e.target}"로 추가 조사` + (e.method ? ` (선택 방식: ${
          {hybrid: '의미+어휘 검색', lexical: '어휘 검색', keyword: '키워드 규칙'}[e.method] || e.method})` : ''),
  DraftWritten: e => `답변 초안 작성 (시도 ${e.attempt})`,
  Validation: e => e.verdict.startsWith('합격')
      ? (e.ungrounded?.length ? `검수 종료 (근거 없는 수치 ${e.ungrounded.length}개 남음 → 경고 표시)` : '검수 통과')
      : (e.ungrounded?.length ? `검수 반려: 근거 없는 수치 ${e.ungrounded.join(', ')} → 다시 작성` : '검수 반려 → 다시 작성'),
  Finalize: () => '최종 답변 완성',
  // 개선 7 — 주 LLM 장애로 보조 LLM이 대신 처리한 단계 (숨기지 않고 표시)
  LLMFallback: e => ({ warn: true, text: `${e.from} 응답 실패(${FALLBACK_REASON[e.reason] || (e.reason.startsWith('LLM_HTTP_') ? '서버 오류 ' + e.reason.slice(9) : e.reason)}) → ${e.to}로 대체 (${STEP_NAME[e.step] || e.step})` }),
  ActionProposed: e => `조치 제안 ${e.actions.length}건 → 승인 대기`,
};
const FALLBACK_REASON = { CIRCUIT_OPEN: '차단 중', TIMEOUT: '시간 초과', LLM_UNREACHABLE: '연결 불가',
  LLM_RATE_LIMIT: '요청 한도', LLM_AUTH: '인증 오류' };
const STEP_NAME = { route: '질문 분류', plan: '계획', analyze: '분석', chat: '대화', write: '답변 작성' };

createApp({
  setup() {
    const backendLabel = ref('all_total_vue');
    const log = ref([]);
    const input = ref('');
    const sending = ref(false);
    const logEl = ref(null);
    const thread = 't-web-' + Math.random().toString(36).slice(2, 8);
    let nextId = 0;

    fetch('/health').then(r => r.json()).then(h => {
      backendLabel.value = `${h.llm_backend} 실모델(${h.fast_llm}/${h.quality_llm}) · all_total_vue`;
    }).catch(() => {});

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    function onSubmit() {
      const text = input.value.trim();
      if (!text) return;

      log.value.push({ id: nextId++, kind: 'user', text });
      input.value = '';
      sending.value = true;
      scrollToBottom();

      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [] });
      log.value.push(stepsItem);
      scrollToBottom();

      const url = `/chat/stream?message=${encodeURIComponent(text)}&thread_id=${encodeURIComponent(thread)}`;
      const es = new EventSource(url);
      let streamItem = null;
      let streamAttempt = null;   // write_node 재작성(attempt 증가) 시 새 말풍선으로 끊는다

      es.onmessage = (event) => {
        if (event.data === '[DONE]') { es.close(); sending.value = false; return; }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }

        if (e.type === 'AnswerToken') {
          if (!streamItem || streamAttempt !== e.attempt) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
            streamAttempt = e.attempt;
          }
          streamItem.text += e.delta;
          scrollToBottom();
          return;
        }

        if (e.type === 'ApprovalRequired') {   // 개선 8 — 답변 뒤에 승인 카드
          log.value.push(reactive({ id: nextId++, kind: 'approval', approvalId: e.approval_id,
            actions: e.actions, expires: e.expires_in_s, status: 'pending', token: adminToken,
            report: '', error: '' }));
          scrollToBottom();
          return;
        }

        if (e.type === 'Error') {
          log.value.push({ id: nextId++, kind: 'error', text: e.message, errorId: e.error_id });
          streamItem = null;
          scrollToBottom();
          return;
        }

        if (e.type === 'FinalAnswer') {
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
          }
          streamItem.text = e.reply;   // 토큰 합산 결과와 서버의 최종 텍스트를 일치시킨다
          if (e.prompt) log.value.push({ id: nextId++, kind: 'prompt', text: e.prompt });
          streamItem = null;
          streamAttempt = null;
          scrollToBottom();
          return;
        }

        const fn = STEP_LABELS[e.type];
        if (!fn) return;
        const label = fn(e);
        if (!label) return;
        stepsItem.steps.push(label);
        scrollToBottom();
      };

      es.onerror = () => {
        // 정상 종료([DONE]) 전에 연결이 끊긴 경우 — 서버 다운·네트워크 단절
        if (sending.value) {
          log.value.push({ id: nextId++, kind: 'error',
                           text: '서버와의 연결이 끊어졌습니다. 잠시 후 다시 시도해 주세요.' });
          scrollToBottom();
        }
        es.close(); sending.value = false;
      };
    }

    // 개선 8 — 승인/거부. 토큰은 이 탭 메모리에만 두고(저장하지 않음) 다음 카드에 미리 채운다
    let adminToken = '';
    async function decide(item, approve) {
      item.status = 'sending'; item.error = '';
      adminToken = item.token;
      try {
        const r = await fetch(`/approvals/${item.approvalId}`, {
          method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-token': item.token },
          body: JSON.stringify({ approve, approver: '운영자' }) });
        const d = await r.json();
        if (d.error) {
          item.error = d.error.message;
          item.status = (r.status === 401 || r.status === 503) ? 'pending' : 'done';
        } else { item.report = d.report; item.status = d.status; }
      } catch {
        item.error = '서버와 연결할 수 없습니다.'; item.status = 'pending';
      }
      scrollToBottom();
    }

    return { backendLabel, log, input, sending, logEl, onSubmit, decide };
  },
}).mount('#app');
</script>
</body>
</html>
